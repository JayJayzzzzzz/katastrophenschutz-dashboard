name: Deploy Astro-Seite zu GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Die amtlichen Warnungen (NINA/BBK) werden beim Bauen der Seite geladen
  # (die API hat kein CORS, ein Live-Fetch im Browser ist nicht möglich) und
  # damit nur bei jedem Deployment aktualisiert. Ein regelmäßiger Zeitplan
  # hält sie halbwegs aktuell, ohne einen eigenen Server zu brauchen.
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deployment gleichzeitig; laufende Läufe werden nicht abgebrochen,
# damit ein Deployment nie halb fertig abgebrochen wird.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Astro-Seite installieren, bauen und hochladen
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Zu GitHub Pages deployen
        id: deployment
        uses: actions/deploy-pages@v4
